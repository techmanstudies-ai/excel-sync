name: SQL Sales Credit Note Sync

on:
  workflow_dispatch:

  schedule:
    # Every day at 2:00 AM Malaysia Time (18:00 UTC)
    - cron: "0 18 * * *"

jobs:
  sync-credit-note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sales Credit Note Header Sync
        env:
          SQL_ACCESS_KEY: ${{ secrets.SQL_ACCESS_KEY }}
          SQL_SECRET_KEY: ${{ secrets.SQL_SECRET_KEY }}
          SQL_GOOGLE_CREDENTIALS: ${{ secrets.SQL_GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python Get_Sales_Credit_Note.py

      - name: Run Sales Credit Note Detail Sync
        env:
          SQL_ACCESS_KEY: ${{ secrets.SQL_ACCESS_KEY }}
          SQL_SECRET_KEY: ${{ secrets.SQL_SECRET_KEY }}
          SQL_GOOGLE_CREDENTIALS: ${{ secrets.SQL_GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python Get_Sales_Credit_Note_Detail.py
