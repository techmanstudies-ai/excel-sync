name: SQL Sales Credit Note Sync

on:
  workflow_dispatch:

  # Optional daily run at 9:30 AM Malaysia time
  # GitHub cron uses UTC, so 1:30 UTC = 9:30 AM Malaysia
  # schedule:
  #   - cron: "30 1 * * *"

jobs:
  run-credit-note-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SQL_ACCESS_KEY: ${{ secrets.SQL_ACCESS_KEY }}
      SQL_SECRET_KEY: ${{ secrets.SQL_SECRET_KEY }}
      SQL_GOOGLE_CREDENTIALS: ${{ secrets.SQL_GOOGLE_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: sql_api_sync
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sales Credit Note Header
        working-directory: sql_api_sync
        run: python Get_Customer_Credit_Note.py

      - name: Run Sales Credit Note Detail
        working-directory: sql_api_sync
        run: python Get_Customer_Credit_Note_Detail.py
