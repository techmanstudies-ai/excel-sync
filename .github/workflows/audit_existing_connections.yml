name: Audit Existing Connections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install audit packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth requests-aws4auth

      - name: Audit connections safely
        shell: bash
        env:
          # Main Microsoft connection
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}

          # Main OneDrive source files
          ESBFILE_ID: ${{ secrets.ESBFILE_ID }}
          FILE_ID: ${{ secrets.FILE_ID }}
          CFIS_FILE_ID: ${{ secrets.CFIS_FILE_ID }}
          LUBRICANT_FILE_ID: ${{ secrets.LUBRICANT_FILE_ID }}
          INCENTIVE_FILE_ID: ${{ secrets.INCENTIVE_FILE_ID }}
          FUEL_FILE_ID: ${{ secrets.FUEL_FILE_ID }}

          # PENPEC / Aging Microsoft connection
          PENPEC_TENANT_ID: ${{ secrets.PENPEC_TENANT_ID }}
          PENPEC_CLIENT_ID: ${{ secrets.PENPEC_CLIENT_ID }}
          PENPEC_CLIENT_SECRET: ${{ secrets.PENPEC_CLIENT_SECRET }}
          PENPEC_USER_EMAIL: ${{ secrets.PENPEC_USER_EMAIL }}
          AGING_FILE_ID: ${{ secrets.AGING_FILE_ID }}

          # Main Google connection and destination sheets
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ESBGOOGLE_SHEET_ID: ${{ secrets.ESBGOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PENPEC_GOOGLE_SHEET_ID: ${{ secrets.PENPEC_GOOGLE_SHEET_ID }}

          # SQL API and SQL Google destination
          SQL_ACCESS_KEY: ${{ secrets.SQL_ACCESS_KEY }}
          SQL_SECRET_KEY: ${{ secrets.SQL_SECRET_KEY }}
          SQL_GOOGLE_CREDENTIALS: ${{ secrets.SQL_GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          from typing import Optional

          import gspread
          import requests
          from google.oauth2.service_account import Credentials
          from requests_aws4auth import AWS4Auth


          def section(title: str) -> None:
              print("\n" + "=" * 78)
              print(title)
              print("=" * 78)


          def is_configured(name: str) -> bool:
              return bool(os.environ.get(name, "").strip())


          def show_configuration_status() -> None:
              section("1. SECRET CONFIGURATION STATUS")

              names = [
                  "TENANT_ID",
                  "CLIENT_ID",
                  "CLIENT_SECRET",
                  "USER_EMAIL",
                  "ESBFILE_ID",
                  "FILE_ID",
                  "CFIS_FILE_ID",
                  "LUBRICANT_FILE_ID",
                  "INCENTIVE_FILE_ID",
                  "FUEL_FILE_ID",
                  "PENPEC_TENANT_ID",
                  "PENPEC_CLIENT_ID",
                  "PENPEC_CLIENT_SECRET",
                  "PENPEC_USER_EMAIL",
                  "AGING_FILE_ID",
                  "GOOGLE_CREDENTIALS",
                  "ESBGOOGLE_SHEET_ID",
                  "GOOGLE_SHEET_ID",
                  "PENPEC_GOOGLE_SHEET_ID",
                  "SQL_ACCESS_KEY",
                  "SQL_SECRET_KEY",
                  "SQL_GOOGLE_CREDENTIALS",
                  "SPREADSHEET_ID",
              ]

              for name in names:
                  status = "CONFIGURED" if is_configured(name) else "MISSING"
                  icon = "OK" if status == "CONFIGURED" else "ERROR"
                  print(f"[{icon}] {name}: {status}")


          GOOGLE_SCOPES = [
              "https://www.googleapis.com/auth/spreadsheets",
              "https://www.googleapis.com/auth/drive",
          ]


          def create_google_client(secret_name: str) -> Optional[gspread.Client]:
              raw = os.environ.get(secret_name, "").strip()

              if not raw:
                  print(f"[ERROR] {secret_name}: missing")
                  return None

              try:
                  data = json.loads(raw)

                  # These are identifiers only. The private key is never printed.
                  print(f"[OK] {secret_name}")
                  print(f"     Service account: {data.get('client_email', 'Unknown')}")
                  print(f"     Google project: {data.get('project_id', 'Unknown')}")

                  credentials = Credentials.from_service_account_info(
                      data,
                      scopes=GOOGLE_SCOPES,
                  )
                  return gspread.authorize(credentials)

              except Exception as error:
                  print(
                      f"[ERROR] {secret_name}: "
                      f"{type(error).__name__}"
                  )
                  return None


          def audit_spreadsheet(
              client: Optional[gspread.Client],
              label: str,
              id_secret_name: str,
          ) -> None:
              spreadsheet_id = os.environ.get(id_secret_name, "").strip()

              if client is None:
                  print(f"[ERROR] {label}: Google client unavailable")
                  return

              if not spreadsheet_id:
                  print(f"[ERROR] {label}: {id_secret_name} is missing")
                  return

              try:
                  spreadsheet = client.open_by_key(spreadsheet_id)
                  tabs = [worksheet.title for worksheet in spreadsheet.worksheets()]

                  print(f"[OK] {label}")
                  print(f"     Spreadsheet title: {spreadsheet.title}")
                  print(f"     Tabs: {', '.join(tabs)}")

              except Exception as error:
                  print(
                      f"[ERROR] {label}: "
                      f"{type(error).__name__}"
                  )


          def audit_google() -> None:
              section("2. GOOGLE SERVICE ACCOUNTS AND DESTINATION SHEETS")

              main_client = create_google_client("GOOGLE_CREDENTIALS")
              sql_client = create_google_client("SQL_GOOGLE_CREDENTIALS")

              print()
              audit_spreadsheet(
                  main_client,
                  "ESB destination",
                  "ESBGOOGLE_SHEET_ID",
              )
              audit_spreadsheet(
                  main_client,
                  "TEST destination",
                  "GOOGLE_SHEET_ID",
              )
              audit_spreadsheet(
                  main_client,
                  "PENPEC destination",
                  "PENPEC_GOOGLE_SHEET_ID",
              )
              audit_spreadsheet(
                  sql_client,
                  "SQL Accounting destination",
                  "SPREADSHEET_ID",
              )


          def get_graph_token(
              tenant_name: str,
              client_name: str,
              secret_name: str,
          ) -> Optional[str]:
              tenant = os.environ.get(tenant_name, "").strip()
              client_id = os.environ.get(client_name, "").strip()
              client_secret = os.environ.get(secret_name, "").strip()

              if not all([tenant, client_id, client_secret]):
                  print(
                      f"[ERROR] Microsoft connection is missing one or more of: "
                      f"{tenant_name}, {client_name}, {secret_name}"
                  )
                  return None

              token_url = (
                  f"https://login.microsoftonline.com/{tenant}"
                  "/oauth2/v2.0/token"
              )

              try:
                  response = requests.post(
                      token_url,
                      data={
                          "client_id": client_id,
                          "scope": "https://graph.microsoft.com/.default",
                          "client_secret": client_secret,
                          "grant_type": "client_credentials",
                      },
                      timeout=30,
                  )

                  if response.status_code != 200:
                      print(
                          f"[ERROR] Microsoft login failed: "
                          f"HTTP {response.status_code}"
                      )
                      return None

                  token = response.json().get("access_token")

                  if not token:
                      print("[ERROR] Microsoft login returned no access token")
                      return None

                  print("[OK] Microsoft login successful")
                  return token

              except Exception as error:
                  print(
                      f"[ERROR] Microsoft login: "
                      f"{type(error).__name__}"
                  )
                  return None


          def audit_drive_file(
              token: Optional[str],
              user_secret_name: str,
              file_secret_name: str,
              label: str,
          ) -> None:
              user_email = os.environ.get(user_secret_name, "").strip()
              file_id = os.environ.get(file_secret_name, "").strip()

              if not token:
                  print(f"[ERROR] {label}: Microsoft token unavailable")
                  return

              if not user_email or not file_id:
                  print(
                      f"[ERROR] {label}: "
                      f"{user_secret_name} or {file_secret_name} is missing"
                  )
                  return

              url = (
                  "https://graph.microsoft.com/v1.0/"
                  f"users/{user_email}/drive/items/{file_id}"
                  "?$select=name,lastModifiedDateTime,size,file"
              )

              try:
                  response = requests.get(
                      url,
                      headers={"Authorization": f"Bearer {token}"},
                      timeout=30,
                  )

                  if response.status_code != 200:
                      print(
                          f"[ERROR] {label}: "
                          f"Microsoft Graph HTTP {response.status_code}"
                      )
                      return

                  data = response.json()

                  print(f"[OK] {label}")
                  print(f"     Excel filename: {data.get('name', 'Unknown')}")
                  print(
                      "     Last modified: "
                      f"{data.get('lastModifiedDateTime', 'Unknown')}"
                  )
                  print(f"     File size: {data.get('size', 'Unknown')} bytes")

              except Exception as error:
                  print(
                      f"[ERROR] {label}: "
                      f"{type(error).__name__}"
                  )


          def audit_microsoft() -> None:
              section("3. MICROSOFT ONEDRIVE SOURCE FILES")

              print("\nMain Microsoft connection")
              main_token = get_graph_token(
                  "TENANT_ID",
                  "CLIENT_ID",
                  "CLIENT_SECRET",
              )

              main_files = [
                  ("ESB source", "ESBFILE_ID"),
                  ("TEST source", "FILE_ID"),
                  ("CFIS source", "CFIS_FILE_ID"),
                  ("Lubricant source", "LUBRICANT_FILE_ID"),
                  ("Incentive source", "INCENTIVE_FILE_ID"),
                  ("Fuel source", "FUEL_FILE_ID"),
              ]

              for label, file_secret in main_files:
                  audit_drive_file(
                      main_token,
                      "USER_EMAIL",
                      file_secret,
                      label,
                  )

              print("\nPENPEC Microsoft connection")
              penpec_token = get_graph_token(
                  "PENPEC_TENANT_ID",
                  "PENPEC_CLIENT_ID",
                  "PENPEC_CLIENT_SECRET",
              )

              audit_drive_file(
                  penpec_token,
                  "PENPEC_USER_EMAIL",
                  "AGING_FILE_ID",
                  "Aging source",
              )


          def audit_sql_api() -> None:
              section("4. SQL ACCOUNTING API CONNECTION")

              access_key = os.environ.get("SQL_ACCESS_KEY", "").strip()
              secret_key = os.environ.get("SQL_SECRET_KEY", "").strip()

              if not access_key or not secret_key:
                  print("[ERROR] SQL_ACCESS_KEY or SQL_SECRET_KEY is missing")
                  return

              auth = AWS4Auth(
                  access_key,
                  secret_key,
                  "ap-southeast-5",
                  "sqlaccount",
              )

              endpoints = [
                  ("Purchase Invoice", "purchaseinvoice"),
                  ("Sales Invoice", "salesinvoice"),
              ]

              for label, document_type in endpoints:
                  url = (
                      f"https://api.sql.my/{document_type}"
                      "?offset=0&limit=1"
                  )

                  try:
                      response = requests.get(
                          url,
                          auth=auth,
                          timeout=30,
                      )

                      if response.status_code == 200:
                          data = response.json().get("data", [])
                          count = len(data) if isinstance(data, list) else 1

                          print(f"[OK] {label} API")
                          print(f"     Endpoint reachable: Yes")
                          print(f"     Test records returned: {count}")
                      else:
                          print(
                              f"[ERROR] {label} API: "
                              f"HTTP {response.status_code}"
                          )

                  except Exception as error:
                      print(
                          f"[ERROR] {label} API: "
                          f"{type(error).__name__}"
                      )


          show_configuration_status()
          audit_google()
          audit_microsoft()
          audit_sql_api()

          section("AUDIT FINISHED")
          print(
              "No passwords, access tokens, private keys, "
              "client secrets, API keys or spreadsheet IDs were printed."
          )
          PY
